name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lightweight-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Smoke test launch imports
        run: python scripts/smoke_test_launch_imports.py

      - name: Run lightweight pytest suite
        env:
          PYTHONPATH: .
        run: pytest -m "not heavy and not integration" -q --tb=short


  lovable-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"
      - name: Install locked Lovable dependencies
        run: bun install --frozen-lockfile
      - name: Build Lovable application and generate TanStack route tree
        run: bun run build
      - name: Test React application
        run: bun run test


  spatialscape-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned upstream SpatialScape
        run: |
          python -m pip install --upgrade pip
          python -m pip install "spatialscape==1.0.0"
      - name: Create observed spatial fixture and build native atlas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import anndata as ad
          import numpy as np
          from scipy.sparse import csr_matrix

          root = Path("data/registry")
          ingested = root / "ingested" / "smoke"
          ingested.mkdir(parents=True, exist_ok=True)
          (root / "datasets").mkdir(parents=True, exist_ok=True)
          a = ad.AnnData(X=csr_matrix([[1., 2., 0.], [2., 1., 3.], [0., 3., 1.], [4., 1., 2.]]))
          a.obs_names = ["spot1", "spot2", "spot3", "spot4"]
          a.var_names = ["GENE1", "GENE2", "GENE3"]
          a.obs["cluster"] = ["A", "A", "B", "B"]
          a.obsm["spatial"] = np.array([[0., 0.], [80., 0.], [0., 80.], [80., 80.]])
          source = (ingested / "smoke.h5ad").resolve()
          a.write_h5ad(source)
          (root / "datasets" / "smoke.json").write_text(json.dumps({
              "adata_path": str(source), "platform": "visium", "sample_id": "smoke",
          }))
          PY
          python scripts/export_spatialscape_bundle.py smoke \
            --registry data/registry --out .ci-spatialscape --already-microns --build
