name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lightweight-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Smoke test launch imports
        run: python scripts/smoke_test_launch_imports.py

      - name: Run lightweight pytest suite
        env:
          PYTHONPATH: .
        run: pytest -m "not heavy and not integration" -q --tb=short


  lovable-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"
      - name: Install locked Lovable dependencies
        run: bun install --frozen-lockfile
      - name: Build Lovable application and generate TanStack route tree
        run: bun run build
      - name: Test React application
        run: bun run test
